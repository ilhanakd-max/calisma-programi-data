name: Google Drive'dan Excel Eşitleme

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı çalışır.
  workflow_dispatch: # Manuel olarak butona basıp çalıştırmanıza izin verir.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Excel Dosyasını İndir
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/17-3hDryOGSglFogJWpul2Fgug61pROKc/export?format=xlsx" -o "KURUM İÇİ ÇALIŞMA PROGRAMI.xlsx"

      - name: Değişiklikleri Kaydet ve GitHub'a Yükle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "KURUM İÇİ ÇALIŞMA PROGRAMI.xlsx"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Google Drive'dan otomatik Excel güncellemesi" && git push)
